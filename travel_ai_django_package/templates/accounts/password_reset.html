{% extends "base.html" %}
{% block title %}비밀번호 찾기 | TravelAI{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-4">🔑 비밀번호 찾기</h3>
          <p class="text-muted">가입한 이메일을 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">이메일 보내기</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

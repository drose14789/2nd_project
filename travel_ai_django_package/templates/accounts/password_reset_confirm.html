{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-4">새 비밀번호 설정</h3>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">비밀번호 변경</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
